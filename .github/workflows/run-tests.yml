name: run-tests

# The branches are tested through their pull request, so the push event is
# only used for the default branch. Otherwise, every commit of a branch with
# an open pull request runs the whole matrix twice.
on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false

      # Only the currently supported Laravel and PHP versions are tested.
      # Laravel 12 (security fixes until Feb 2027) is the minimum supported
      # release, and Laravel 13 requires PHP 8.3 or higher. The lowest
      # dependencies are only verified on the minimum supported PHP version of
      # every Laravel release, the remaining jobs use the stable ones.
      matrix:
        include:
          - { php: 8.2, laravel: '12.*', testbench: '10.*', stability: prefer-lowest }
          - { php: 8.2, laravel: '12.*', testbench: '10.*', stability: prefer-stable }
          - { php: 8.3, laravel: '12.*', testbench: '10.*', stability: prefer-stable }
          - { php: 8.4, laravel: '12.*', testbench: '10.*', stability: prefer-stable }
          - { php: 8.5, laravel: '12.*', testbench: '10.*', stability: prefer-stable }
          - { php: 8.3, laravel: '13.*', testbench: '11.*', stability: prefer-lowest }
          - { php: 8.3, laravel: '13.*', testbench: '11.*', stability: prefer-stable }
          - { php: 8.4, laravel: '13.*', testbench: '11.*', stability: prefer-stable }
          - { php: 8.5, laravel: '13.*', testbench: '11.*', stability: prefer-stable }

    name: P${{ matrix.php }} - L${{ matrix.laravel }} - ${{ matrix.stability }}

    steps:

      # Checkout the package code.
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      # Cache dependencies and build outputs to improve workflow execution time.
      - name: Cache dependencies
        uses: actions/cache@v5
        with:
          path: ~/.composer/cache/files
          key: dependencies-laravel-${{ matrix.laravel }}-php-${{ matrix.php }}-composer-${{ hashFiles('composer.json') }}

      # Setup PHP and extensions.
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, iconv
          coverage: none

      # Verify the package metadata before installing anything.
      - name: Validate composer.json
        run: composer validate --strict --no-check-lock

      # Install the package dependencies.
      - name: Install dependencies
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update
          composer update --${{ matrix.stability }} --prefer-dist --no-interaction

      # Execute the test suite for Laravel.
      - name: Execute Laravel tests
        run: vendor/bin/phpunit --testsuite Laravel
